version: '3.8'

services:
  app:
    image: php:8.1-cli
    container_name: iclc-app
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    networks:
      - iclc-network
    depends_on:
      - mysql
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=iclc_db
      - DB_USERNAME=iclc_user
      - DB_PASSWORD=password

  mysql:
    image: mysql:8.0
    container_name: iclc-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: iclc_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_PASSWORD: password
      MYSQL_USER: iclc_user
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - iclc-network

networks:
  iclc-network:
    driver: bridge

volumes:
  mysql_data:

