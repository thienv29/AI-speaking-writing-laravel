services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iclc-app
    working_dir: /var/www/html
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - iclc-network
    depends_on:
      mysql:
        condition: service_healthy
    # Quy trình khởi động tự động được thực hiện:
    # Bước 1: Chờ MySQL sẵn sàng (có logic thử lại)
    # Bước 2: Cài đặt dependencies bằng composer (kiểm tra vendor folder)
    # Bước 3: Tạo APP_KEY nếu chưa tồn tại (php artisan key:generate)
    # Bước 4: Tối ưu hóa Laravel (cache config, route, view)
    # Bước 5: Thực thi migrations (fresh --seed cho lần đầu tiên, migrate cho lần sau)
    # Bước 6: Thiết lập storage link và phân quyền
    # Bước 7: Khởi động Laravel development server
    command: ["/usr/local/bin/docker-entrypoint.sh"]
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_DATABASE=${DB_DATABASE:-iclc_db}
      - DB_USERNAME=${DB_USERNAME:-iclc_user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - CACHE_DRIVER=${CACHE_DRIVER:-file}
      - SESSION_DRIVER=${SESSION_DRIVER:-file}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-sync}
    healthcheck:
      test: ["CMD", "php", "-r", "file_get_contents('http://localhost:8000') ? exit(0) : exit(1);"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.0
    container_name: iclc-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-iclc_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-iclc_user}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - iclc-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: iclc-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: ${DB_HOST:-mysql}
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-iclc_user}
      PMA_PASSWORD: ${DB_PASSWORD:-password}
      UPLOAD_LIMIT: 256M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - iclc-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai-speech-service:
    build:
      context: ../ai-speech-service
      dockerfile: Dockerfile
    container_name: iclc-ai-speech-service
    restart: unless-stopped
    ports:
      - "${SPEECH_SERVICE_PORT:-5001}:8000"
    volumes:
      - ../ai-speech-service:/app
      - ../ai-speech-service/outputs:/app/outputs
    networks:
      - iclc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  iclc-network:
    driver: bridge

volumes:
  mysql_data:

