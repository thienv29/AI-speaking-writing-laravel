version: '3.8'

services:
  app:
    build: .
    container_name: iclc-app
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    networks:
      - iclc-network
    depends_on:
      mysql:
        condition: service_healthy
    command: ["/usr/local/bin/docker-entrypoint.sh"]
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=iclc_db
      - DB_USERNAME=iclc_user
      - DB_PASSWORD=password
    healthcheck:
      test: ["CMD", "php", "-r", "file_get_contents('http://localhost:8000') ? exit(0) : exit(1);"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8.0
    container_name: iclc-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: iclc_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_PASSWORD: password
      MYSQL_USER: iclc_user
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - iclc-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  iclc-network:
    driver: bridge

volumes:
  mysql_data:

