version: '3.8'

services:
  app:
    image: thienv29/iclc-speaking-and-writing-app:demo
    container_name: iclc-app-deploy
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    networks:
      - iclc-network
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Laravel App Settings
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      
      # Database Configuration
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-iclc_db}
      - DB_USERNAME=${DB_USERNAME:-iclc_user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      
      # Cache & Session
      - CACHE_DRIVER=${CACHE_DRIVER:-file}
      - SESSION_DRIVER=${SESSION_DRIVER:-file}
      - SESSION_LIFETIME=120
      
      # Queue
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-sync}
      
      # Logging
      - LOG_CHANNEL=${LOG_CHANNEL:-stack}
      - LOG_LEVEL=${LOG_LEVEL:-error}
      
      # Google Gemini API (nếu có)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      
      # File Storage
      - FILESYSTEM_DISK=${FILESYSTEM_DISK:-local}
      
    volumes:
      # Persistent storage cho uploads và logs
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
      
    healthcheck:
      test: ["CMD", "php", "-r", "file_get_contents('http://localhost:8000') ? exit(0) : exit(1);"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
      
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.0
    container_name: iclc-mysql-deploy
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-iclc_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${DB_USERNAME:-iclc_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - iclc-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

 
  ai-speech-service:
    image: ${SPEECH_SERVICE_IMAGE:-thienv29/ai-speech-service:latest}
    container_name: iclc-ai-speech-service-deploy
    restart: unless-stopped
    ports:
      - "${SPEECH_SERVICE_PORT:-5001}:8000"
    volumes:
      - speech_outputs:/app/outputs
    networks:
      - iclc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  iclc-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  app_storage:
    driver: local
  app_bootstrap_cache:
    driver: local
  speech_outputs:
    driver: local


